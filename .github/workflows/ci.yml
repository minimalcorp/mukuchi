# PR の検査。job の name は main の ruleset の required status checks と一致させる (変えたら ruleset も直す)。
# PR の変更ファイルに応じて必要な job だけ動かす。on: の paths は使わない (ワークフローごとスキップされると
# required checks が pending のまま残るため)。代わりに changes job で判定し、各 job の if でスキップする
# (job 単位のスキップは skipped として required を満たす)。changes が失敗したら全 job を動かす
# (needs が失敗した job は skipped になり、検査なしで required を素通りしてしまうため)。
# 手元の make と同じ道具で動かすため、desktop の job は flake の devShell (nix develop) の中で実行する。
# nix develop はサブディレクトリからでも上位の flake.nix (リポジトリ直下) を見つける。
# web の job は macOS 固有の道具を使わないため ubuntu で動かす (flake は aarch64-darwin のみ)。
# Node は flake と同じ 24、pnpm はルート package.json の packageManager の版を使う。
# main への push では動かさない (以前は LP の自動デプロイのために動かしていた。デプロイは release.yml の手動実行のみ。
# main に入るのは required checks を通った PR と release.yml の版上げコミット (版の行だけ))。
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変更ファイルから動かす job を決める。checkout せず API で一覧を取る (サードパーティ action は使わない)
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      frontend: ${{ steps.detect.outputs.frontend }}
      asr: ${{ steps.detect.outputs.asr }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - name: Detect changed areas
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail

          set_all() {
            for k in rust frontend asr web; do echo "$k=$1" >> "$GITHUB_OUTPUT"; done
          }

          # workflow_dispatch (PR なし) は全部動かす
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "PR ではないため全 job を実行"; set_all true; exit 0
          fi
          # files API は 3000 件までしか返さない。取りこぼしで検査が抜けないよう全部動かす
          if [ "${CHANGED_FILES:-0}" -ge 3000 ]; then
            echo "変更ファイルが ${CHANGED_FILES} 件 (API の上限以上) のため全 job を実行"; set_all true; exit 0
          fi

          # リネームは移動元も見る (移動元の領域の検査も必要なため)
          files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          echo "変更ファイル:"; printf '%s\n' "$files"

          # 正規表現はリポジトリ相対のパスに対する grep -E
          # ci.yml 自体の変更は全 job で確かめる
          ALL=( '^\.github/workflows/ci\.yml$' )
          # macOS の3 job は flake の devShell で動くため
          DEVSHELL=( '^flake\.(nix|lock)$' )
          RUST=(
            '^apps/desktop/src-tauri/'
            '^rust-toolchain\.toml$'
            # CI の Prepare bundle resources で使う
            '^apps/desktop/scripts/(prepare-bundle-resources|fetch-uv|make-verify-wav)\.sh$'
            # rust-windows の Prepare bundle resources・installer-windows で使う
            '^apps/desktop/scripts/(fetch-llama-server|fetch-vc-runtime|check-windows-dlls|build-windows)\.mjs$'
            # tauri.conf.json の bundle.resources (tauri-build が要求する)
            '^apps/desktop/THIRD_PARTY_NOTICES$'
            '^(LICENSE|NOTICE)$'
          )
          FRONTEND=(
            '^apps/desktop/src/'
            '^apps/desktop/e2e/'
            # package.json・vite/tsconfig/eslint/playwright の設定・index.html・components.json 等
            '^apps/desktop/[^/]+$'
            # AboutSection.tsx が ?raw で import する
            '^(LICENSE|NOTICE)$'
            # workspace 全体の依存
            '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$'
          )
          ASR=( '^apps/desktop/asr-server/' )
          WEB=(
            '^apps/web/'
            # リリース用スクリプトのテスト (node --test scripts/*.test.mjs)
            '^scripts/'
            # typecheck で検査する
            '^(sst\.config\.ts|tsconfig\.json)$'
            # workspace 全体の依存
            '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$'
            # scripts/bump-version.test.mjs が実ファイルを複製してテストする
            '^apps/desktop/src-tauri/(tauri\.conf\.json|Cargo\.toml|Cargo\.lock)$'
            '^apps/desktop/package\.json$'
            # scripts/check-release-blockers.test.mjs が実ファイルを読む
            '^apps/desktop/src-tauri/src/provisioning/models\.rs$'
          )
          # どの job の検査にも影響しない (ビルド・テストが読む .md は無い)。各 job の対象より優先する
          # (apps/web/README.md 等、job の対象のディレクトリにある文書だけの変更で job を動かさないため)
          IGNORE=(
            '^(docs|\.claude|assets|spikes|\.vscode)/'
            '\.md$'
            '^(Makefile|process-compose\.yaml|\.envrc|\.gitignore)$'
            '^\.github/workflows/(release|undeploy-web)\.yml$'
            # make build*・setup・reset・uninstall 用 (CI のどの job も実行しない)。RUST の3本は除く
            '^apps/desktop/scripts/(build-macos|dev-reset|setup|uninstall|verify-macos)\.sh$'
            '^apps/desktop/scripts/(check-dmg-layout|check-updater-archive|dmg-settings|run-dmgbuild)\.py(\.lock)?$'
          )

          # 配列の正規表現を | でつないで1つでも当たれば 0
          matches() {
            local IFS='|'
            grep -Eq "$*" <<< "$files"
          }
          result() {
            if matches "$@"; then echo true; else echo false; fi
          }

          ignore=$(IFS='|'; echo "${IGNORE[*]}")
          files=$(grep -Ev "$ignore" <<< "$files" || true)

          # どの分類にも当たらないファイルがあれば全部動かす (新しいファイルの分類漏れで検査が抜けないように)
          known=$(IFS='|'; echo "${ALL[*]}|${DEVSHELL[*]}|${RUST[*]}|${FRONTEND[*]}|${ASR[*]}|${WEB[*]}")
          unknown=$(grep -Ev "$known" <<< "$files" || true)
          if [ -n "$unknown" ]; then
            echo "分類されていないファイルがあるため全 job を実行:"; printf '%s\n' "$unknown"
            set_all true; exit 0
          fi

          {
            echo "rust=$(result "${ALL[@]}" "${DEVSHELL[@]}" "${RUST[@]}")"
            echo "frontend=$(result "${ALL[@]}" "${DEVSHELL[@]}" "${FRONTEND[@]}")"
            echo "asr=$(result "${ALL[@]}" "${DEVSHELL[@]}" "${ASR[@]}")"
            echo "web=$(result "${ALL[@]}" "${WEB[@]}")"
          } | tee -a "$GITHUB_OUTPUT"

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    # changes が成功しなかったら (失敗・タイムアウト) 判定に頼らず動かす
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    # MLX・Core Audio 等の都合で対象は Apple Silicon の macOS のみ (flake も aarch64-darwin のみ)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      # tauri-build は bundle.resources (asr-server/ 等) と frontendDist を要求する。
      # テストでは画面を使わないため frontendDist は空のディレクトリでよい
      - name: Prepare bundle resources
        run: nix develop -c bash -c 'scripts/prepare-bundle-resources.sh && mkdir -p dist'
      - name: cargo fmt
        run: nix develop -c cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: cargo clippy
        run: nix develop -c cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: cargo test
        run: nix develop -c cargo test --manifest-path src-tauri/Cargo.toml --locked

  # Windows 版 (docs/plans/windows-plan.md)。Windows に nix は無いため rustup (rust-toolchain.toml の版) で動かす。
  # ビルド・lint・単体テストを確かめる (GPU・llama-server・実モデルを使う通しの確認は ignored のテストで手元の実機で行う)
  rust-windows:
    name: Rust Windows (fmt, clippy, test)
    needs: changes
    # changes が成功しなかったら (失敗・タイムアウト) 判定に頼らず動かす
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
            apps/desktop/.build-cache/llama-server
            apps/desktop/.build-cache/vc-runtime
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/scripts/fetch-llama-server.mjs', 'apps/desktop/scripts/fetch-vc-runtime.mjs') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      # 引数なしの toolchain install は rust-toolchain.toml の版と components を入れる
      - name: Install Rust toolchain
        run: rustup toolchain install
      # tauri-build は bundle.resources (tauri.windows.conf.json で llama-server/・vc-runtime/ を足したもの) と frontendDist を要求する。
      # verify.wav は日本語の SAPI 音声 (make-verify-wav.ps1) が runner に無いことがあり、テストでは使わないため空のファイルを置く。
      # frontendDist は空のディレクトリでよい (macOS の job と同じ)
      - name: Prepare bundle resources
        run: |
          node scripts/fetch-llama-server.mjs
          New-Item -ItemType File -Force src-tauri/bundle-resources/verify.wav | Out-Null
          New-Item -ItemType Directory -Force dist | Out-Null
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # Windows のフロントエンド。Windows の WebView2 (Chromium) に近い chromium で、Windows の表示 (@windows。
  # playwright.config.ts の win-ja / win-en) を確かめる。Mac の frontend job (webkit) とは別に動かす
  frontend-windows:
    name: Frontend Windows (lint, build, e2e)
    needs: changes
    # changes が成功しなかったら (失敗・タイムアウト) 判定に頼らず動かす
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop
    steps:
      # Windows の Git の既定 (core.autocrlf=true) だと CRLF になり、prettier 等の検査が Mac と変わる
      - name: Disable autocrlf
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm run lint
      # tsc (型検査) + vite build
      - name: build
        run: pnpm run build
      # playwright.config.ts はホストが Windows なら win-ja / win-en (chromium) だけを回す
      - name: Playwright (chromium)
        run: |
          pnpm exec playwright install chromium
          pnpm exec playwright test

  # Windows のインストーラー (NSIS、署名なし) が作れること。release.yml の build-windows と同じ
  # apps/desktop/scripts/build-windows.mjs で、同梱物 (llama-server・VC++ ランタイム) の依存の確認
  # (check-windows-dlls.mjs) とインストーラーの中身の確認までを行う。仮の値の検査 (check-release-blockers) は
  # リリースの時だけ (--no-blockers)。verify.wav はランナーに日本語音声が無いことがあるため空のものを置く (配布しない)
  installer-windows:
    name: Windows installer (NSIS, unsigned)
    needs: changes
    # changes が成功しなかったら (失敗・タイムアウト) 判定に頼らず動かす
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # release (opt-level 等) は rust-windows (debug) と成果物が違うため、キャッシュの key を分ける
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
            apps/desktop/.build-cache/llama-server
            apps/desktop/.build-cache/vc-runtime
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/scripts/fetch-llama-server.mjs', 'apps/desktop/scripts/fetch-vc-runtime.mjs') }}
          restore-keys: cargo-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Build installer
        run: node apps/desktop/scripts/build-windows.mjs --no-blockers --placeholder-verify-wav
      - name: Installer size
        run: Get-ChildItem apps/desktop/src-tauri/target/release/bundle/windows-release | Format-Table Name, Length

  frontend:
    name: Frontend (lint, build, e2e)
    needs: changes
    # changes が成功しなかったら (失敗・タイムアウト) 判定に頼らず動かす
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/pnpm/store
            ~/Library/Caches/ms-playwright
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      # workspace 全体 (リポジトリ直下の pnpm-lock.yaml) を入れる
      - name: pnpm install
        run: nix develop -c pnpm install --frozen-lockfile
      - name: lint
        run: nix develop -c pnpm run lint
      - name: build
        run: nix develop -c pnpm run build
      # Tauri の WebView (WKWebView) に近い WebKit で、モック (src/mock) の画面を確認する
      - name: Playwright (webkit)
        run: nix develop -c bash -c 'pnpm exec playwright install webkit && pnpm exec playwright test'

  asr-server:
    name: ASR server (ruff, pytest)
    needs: changes
    # changes が成功しなかったら (失敗・タイムアウト) 判定に頼らず動かす
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.asr == 'true') }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/asr-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/asr-server/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ runner.arch }}-
      - name: uv sync
        run: nix develop -c uv sync --frozen
      - name: ruff
        run: nix develop -c bash -c 'uv run --frozen ruff check . && uv run --frozen ruff format --check .'
      # test_convert は MLX (Metal) を使う
      - name: pytest
        run: nix develop -c uv run --frozen pytest -q

  web:
    name: Web (lint, typecheck, build)
    needs: changes
    # changes が成功しなかったら (失敗・タイムアウト) 判定に頼らず動かす
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm --filter @mukuchi/web run lint
      # web の型検査と sst.config.ts の型検査 (型は sst install が .sst/platform に生成する。AWS の認証情報は不要)
      - name: typecheck
        run: pnpm run typecheck
      - name: build
        run: pnpm run web:build
      # リリース用スクリプト (scripts/bump-version.mjs・check-release-blockers.mjs 等。release.yml が使う)
      - name: Release scripts (node --test)
        run: node --test scripts/*.test.mjs
      - name: Playwright (chromium)
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium && pnpm exec playwright test

[package]
name = "mukuchi"
version = "0.4.2"
description = "Voice input app"
authors = ["minimalcorp"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mukuchi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: 透明ウィンドウ (panel) に必要。tauri-nspanel も要求する (App Store 配布はしない)
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-log = "2"
# 2つ目のプロセスを起動させない (macOS は /tmp の Unix ソケット。識別子ごとなので dev と本番は別)
tauri-plugin-single-instance = "2.5"
# ON/OFF のショートカット (macOS は Carbon RegisterEventHotKey。追加の権限は不要)。登録は Rust からのみ行う
tauri-plugin-global-shortcut = "2.4"
# 自動アップデート (docs/architecture.md「アップデート」)。Rust からのみ使う (JS には権限を出さない)。
# TLS は他の通信と同じ native-tls (システムの信頼ストア)。zip は Windows 用のため外す
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "fs", "io-util"] }
# native-tls: モデルの取得 (Hugging Face) に使う。macOS の Security.framework (システムの信頼ストア) で検証する
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }
# モデルのファイルの検証 (LFS は sha256、それ以外は git の blob id = sha1)
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
cpal = "0.18"
rubato = "0.16"
hound = "3.5"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "api-22"] }
unicode-normalization = "0.1"
url = "2"
# アップデートの版の比較 (取得済みより新しい時だけ取り直す)。updater と同じ crate
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# フォーカスを奪わないパネル (NSPanel)。Handy と同じ作者の v2.1 系 (crates.io 公開版)
tauri-nspanel = "2.1"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSGeometry", "NSLocale", "NSNotification", "NSOperation", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "libc", "objc2-core-foundation", "NSAppearance", "NSApplication", "NSBezierPath", "NSBitmapImageRep", "NSButton", "NSCell", "NSColor", "NSControl", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFData", "CFString"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "AXUIElement"] }
# ログイン時に起動 (SMAppService, macOS 13+)。tauri-plugin-autostart は LaunchAgent/AppleScript 方式のみのため使わない
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(windows)'.dependencies]
# OS 依存部 (src/platform/windows/)。版は tauri (tao・wry) と同じ 0.62 にそろえる (二重にビルドしない)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12"] }
# ログイン時に起動 (HKCU の Run)・マイクの許可の状態の読み取り。tauri と同じ版
windows-registry = "0.6"
# llama-server への音声 (WAV) の送信 (input_audio は base64)。tauri と同じ版
base64 = "0.22"
# llama-server の API キー (起動ごとに作る乱数)。tauri と同じ版
getrandom = "0.3"

[target.'cfg(windows)'.dev-dependencies]
# examples/win_spike.rs (実機の検証) だけが使う: 前面の変化の監視・クリップボードの履歴の確認 (WinRT は STA)
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com", "ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

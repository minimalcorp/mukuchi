[project]
name = "mukuchi-asr"
version = "0.1.0"
description = "mukuchi ASR server (Qwen3-ASR on MLX)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-qwen3-asr==0.4.4",
    "mlx==0.32.0",
    "fastapi==0.142.0",
    "uvicorn==0.54.0",
    "numpy==2.5.3",
]

[project.scripts]
mukuchi-asr = "mukuchi_asr.__main__:main"

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

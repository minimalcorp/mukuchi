# LP の本番 (SST の production ステージ) を撤去する。手動実行のみ。
# sst.config.ts は production を retain・protect にしており、SST_ALLOW_REMOVE=true の時だけ撤去できる。
# retain のため S3 バケット等の一部のリソースは残る (必要なら AWS 側で手動で消す)
# 承認は先頭の approve job (Environment release-approval) で1回だけ求める。production-web は secret・変数の置き場で
# 承認者を置かない (理由は release.yml の先頭のコメント)
name: Undeploy web

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to confirm removal'
        required: true

permissions:
  contents: read

# Release (release.yml) と同時に動かさない
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 承認だけを行う (checkout もしない)。release-approval には secret・変数を置かない
  approve:
    name: Approve (undeploy web production)
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Approved
        run: echo "承認済み (web production の撤去)"

  remove:
    needs: approve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-web
    permissions:
      id-token: write # AWS の OIDC 用
      contents: read
    steps:
      # 入力は式展開せず環境変数で渡す (スクリプトへの差し込みを避ける)
      - name: Check confirmation input
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != production ]; then
            echo '確認の入力が "production" と一致しない。中止する'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # sst.config.ts の run() は production で MUKUCHI_WEB_CERT_ARN を要求するため remove でも渡す
      - name: sst remove
        env:
          SST_ALLOW_REMOVE: "true"
          MUKUCHI_WEB_CERT_ARN: ${{ vars.MUKUCHI_WEB_CERT_ARN }}
        run: pnpm exec sst remove --stage production

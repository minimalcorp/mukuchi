# PR の検査。job の name は main の ruleset の required status checks と一致させる (変えたら ruleset も直す)。
# required にする job には paths フィルタを付けない (スキップされると pending のまま残るため)。
# 手元の make と同じ道具で動かすため、どの job も flake の devShell (nix develop) の中で実行する。
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    # MLX・Core Audio 等の都合で対象は Apple Silicon の macOS のみ (flake も aarch64-darwin のみ)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      # tauri-build は bundle.resources (asr-server/ 等) と frontendDist を要求する。
      # テストでは画面を使わないため frontendDist は空のディレクトリでよい
      - name: Prepare bundle resources
        run: nix develop -c bash -c 'scripts/prepare-bundle-resources.sh && mkdir -p dist'
      - name: cargo fmt
        run: nix develop -c cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: cargo clippy
        run: nix develop -c cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: cargo test
        run: nix develop -c cargo test --manifest-path src-tauri/Cargo.toml --locked

  frontend:
    name: Frontend (lint, build, e2e)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/Library/Caches/ms-playwright
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-
      - name: npm ci
        run: nix develop -c npm ci
      - name: lint
        run: nix develop -c npm run lint
      - name: build
        run: nix develop -c npm run build
      # Tauri の WebView (WKWebView) に近い WebKit で、モック (src/mock) の画面を確認する
      - name: Playwright (webkit)
        run: nix develop -c bash -c 'npx playwright install webkit && npx playwright test'

  asr-server:
    name: ASR server (ruff, pytest)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('asr-server/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ runner.arch }}-
      - name: uv sync
        run: nix develop -c uv sync --project asr-server --frozen
      # nix develop はリポジトリ直下 (flake.nix のある場所) で実行する
      - name: ruff
        run: nix develop -c bash -c 'cd asr-server && uv run --frozen ruff check . && uv run --frozen ruff format --check .'
      # test_convert は MLX (Metal) を使う
      - name: pytest
        run: nix develop -c bash -c 'cd asr-server && uv run --frozen pytest -q'

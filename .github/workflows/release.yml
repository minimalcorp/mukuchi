# リリース・デプロイ (手動実行のみ)。desktop (署名・公証済み .dmg を GitHub Release に公開) と web (LP を SST で本番へ) を
# 1つの workflow で扱い、版 (X.Y.Z) を上げる。手順は docs/release.md。
#
# 入力: target (desktop | web)・bump (patch | minor | major)。main からのみ実行できる (prepare の最初の step で止める。
# どの Environment の deployment branch policy も main のみ)。
#
# 版上げの流れ:
#   approve … 承認を待つだけ (Environment release-approval)。以降の job はすべて prepare 経由でこれを待つ
#   prepare … 開始時の main (github.sha) の上に版上げコミットをローカルで作る (scripts/release-commit.sh)。
#             作者・日時を固定するため、後の job で同じ入力から作り直すと同じコミット ID になる
#   desktop … build (secret なし) → sign (production-desktop) → publish-desktop (production-desktop)
#             → deploy-web-for-desktop (production-web。LP の版の表示を合わせる。版上げ・タグなし)
#   web     … deploy-web (production-web) → publish-web (production-web)
#   publish の job だけが Deploy Key (RELEASE_DEPLOY_KEY。両 Environment の secret) を読み、版上げコミットと注釈付きタグ
#   (desktop-v<ver> / web-v<ver>) を main へ push する。main が開始時から進んでいたら rebase せず止める
#   (scripts/release-push.sh)。ビルド・署名・公証・検証・デプロイが失敗したら push しない
#
# 承認: 先頭の approve job (Environment release-approval) で1回だけ求める。承認は job 単位で、Required reviewers の
# ある Environment を使う job が始まる時にだけ求められる。そのため承認者は release-approval にだけ置き、
# production-desktop / production-web は secret・変数の置き場として承認者なし (deployment branch policy は main のみ) にする
# (後段の Environment に承認者を置くと、その job でもう一度止まる)。
# 承認に secret を置かない専用の Environment を使うのは、production-* を承認に使うと、その secret を使わない job
# にまで鍵を読める状態を渡すことになるため (Environment の secret はその Environment を指定した job なら読める)。
# 承認待ちの間も run は concurrency (group: release) を占めるため、後から実行した Release・Undeploy web は待つ
# (待てるのは1件だけで、さらに実行すると待っていた方は取り消される)。
# publish を別 job にするのは、第三者のコード (pnpm・cargo の依存、ビルドした本体、sst) が動いた job に Deploy Key を
# 渡さないため (起動されたプロセスは job の終わりまで残りうる)。
#
# desktop の job を分ける理由 (apps/desktop/scripts/build-macos.sh の --build-only / --sign-only):
#   build … pnpm install・cargo で署名なしの .app と、dmgbuild で .dmg のテンプレート (背景・アイコン位置。.app なし) を作る。
#           依存 (postinstall・build.rs 等の第三者のコード) が動くため secret を一切渡さない (environment も付けない)。
#           両方を tar にして artifact で渡す
#   sign  … 依存を入れず、ビルドもしない。受け取った .app を Apple のツールだけで署名・公証し、テンプレートに入れて .dmg にする。
#           updater 用に staple 済みの .app の tar.gz も作る (署名 (.sig)・latest.json は publish-desktop が作る)
#           (テンプレートは入れる前に apps/desktop/scripts/check-dmg-layout.py で余計なファイルがないことを確かめる)。
#           ビルドした本体を実行する検証 (verify-macos.sh の --print-uv-path) は資格情報を片付けた後に行う
# 同じ job の別 step にしないのは、ビルド中に起動されたプロセスが job の終わりまで残り、後の step の secret や
# 解錠したキーチェーンに触れうるため (runner は job の終わりにプロセスを片付ける)
#
# production-desktop の secret:
#   APPLE_CERTIFICATE           Developer ID Application 証明書と秘密鍵の .p12 を base64 にしたもの
#   APPLE_CERTIFICATE_PASSWORD  .p12 のパスワード
#   APPLE_API_KEY               App Store Connect API キーのキーID
#   APPLE_API_ISSUER            同 Issuer ID
#   APPLE_API_KEY_P8            同 .p8 ファイルの中身 (PEM テキストそのまま)
#   RELEASE_DEPLOY_KEY          main へ push する Deploy Key (write) の秘密鍵 (production-web にも同じもの)
#   TAURI_SIGNING_PRIVATE_KEY   updater の署名鍵 (tauri signer generate の秘密鍵ファイルの中身。publish-desktop の署名の step だけが読む)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  同パスワード
# production-web の変数: AWS_DEPLOY_ROLE_ARN・AWS_REGION・MUKUCHI_WEB_CERT_ARN (OIDC で AWS のロールを引き受ける。長期の鍵を置かない。
# 手順は .claude/plans/aws-web-deploy-setup.md)
name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "リリースするもの"
        required: true
        type: choice
        options:
          - desktop
          - web
      bump:
        description: "版の上げ方 (X.Y.Z)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

# 同時に1つだけ (undeploy-web.yml も同じ group)。後の run は待つ (取り消さない)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 承認だけを行う (checkout もしない)。release-approval には secret・変数を置かない
  approve:
    name: Approve (${{ inputs.target }}, ${{ inputs.bump }})
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Approved
        env:
          TARGET: ${{ inputs.target }}
          BUMP: ${{ inputs.bump }}
        run: echo "承認済み ($TARGET, $BUMP)"

  prepare:
    name: Prepare (${{ inputs.target }}, ${{ inputs.bump }})
    needs: approve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bump.outputs.version }}
      previous: ${{ steps.bump.outputs.previous }}
      tag: ${{ steps.bump.outputs.tag }}
      commit: ${{ steps.bump.outputs.commit }}
      epoch: ${{ steps.bump.outputs.epoch }}
    steps:
      # 後の job はすべてこの job を needs で待つ
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::Release は main からのみ実行できる (この run は $REF)。Run workflow で Branch: main を選ぶ"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test bump script
        run: node --test scripts/*.test.mjs
      # 入力は式展開せず環境変数で渡す (スクリプトへの差し込みを避ける)
      - name: Bump version (local commit only)
        id: bump
        env:
          TARGET: ${{ inputs.target }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          epoch="$(date -u +%s)"
          scripts/release-commit.sh "$TARGET" "$BUMP" "$epoch" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
      # 長いビルドの前に止めるための早期の検査。このトークンでは下書きの Release が見えないため、
      # 下書きを含めた確認は publish-desktop でもう一度行う
      - name: Check tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")" ]; then
            echo "::error::タグ $TAG が既にある"; exit 1
          fi
          if [ -n "$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .tag_name")" ]; then
            echo "::error::$TAG の Release が既にある"; exit 1
          fi
      - name: Summary
        env:
          TARGET: ${{ inputs.target }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          {
            echo "### $TARGET $PREVIOUS → $VERSION"
            echo "- タグ: \`$TAG\`"
            echo "- ソース: \`$GITHUB_SHA\` (開始時の main) + 版上げコミット \`$COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- desktop

  build:
    name: Build unsigned .app
    needs: prepare
    if: inputs.target == 'desktop'
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 初回セットアップの検証用音声 (verify.wav) を scripts/make-verify-wav.sh が say -v Kyoko で作る。
      # GitHub の macOS ランナーに日本語音声 Kyoko が入っているかは公式に記載がないため、ビルド前に確かめて止める
      # (無い場合の代わりの方法は docs/release.md)
      - name: Check Japanese voice (Kyoko)
        run: |
          set -euo pipefail
          if ! /usr/bin/say -v '?' | grep -q '^Kyoko '; then
            echo "::error::このランナーに音声 Kyoko がない (verify.wav を作れない)。docs/release.md の「verify.wav の音声」を参照"
            /usr/bin/say -v '?' | awk '{print $1, $2}' | sort -u | head -100
            exit 1
          fi
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # prepare と同じ版上げコミットを作ってからビルドする (.app の版と、埋め込むコミットの短縮ハッシュがこのコミットになる)
      - name: Bump version (same commit as prepare)
        env:
          BUMP: ${{ inputs.bump }}
          EPOCH: ${{ needs.prepare.outputs.epoch }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: nix develop -c scripts/release-commit.sh desktop "$BUMP" "$EPOCH" "$COMMIT"
      - name: pnpm install
        run: nix develop -c pnpm install --frozen-lockfile
      - name: Build (.app, unsigned + .dmg template)
        run: nix develop -c apps/desktop/scripts/build-macos.sh --build-only
      # artifact は zip になり symlink・実行権限が崩れるため tar にしてから渡す
      - name: Pack .app and .dmg template
        run: tar -C apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle -czf "$RUNNER_TEMP/mukuchi-app.tar.gz" macos/mukuchi.app dmg-template/mukuchi.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mukuchi-app-unsigned
          path: ${{ runner.temp }}/mukuchi-app.tar.gz
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and notarize (.dmg)
    needs: [prepare, build]
    runs-on: macos-15
    environment: production-desktop
    permissions:
      contents: read
    timeout-minutes: 150
    steps:
      # apps/desktop/scripts/ を build job の作業ツリーではなく開始時のコミットから取り直す (ビルド中に書き換えられたものを使わない)。
      # 版上げは版の4か所しか変えないため、ここでは作らない (.dmg の名前・版は .app の Info.plist から読む)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mukuchi-app-unsigned
          path: ${{ runner.temp }}
      - name: Unpack .app and .dmg template
        run: |
          set -euo pipefail
          dir=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p "$dir"
          tar -C "$dir" -xzf "$RUNNER_TEMP/mukuchi-app.tar.gz" macos/mukuchi.app dmg-template/mukuchi.dmg
      # 資格情報を読み込む前に .app の版を確かめる
      - name: Check .app version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/mukuchi.app/Contents/Info.plist)"
          [ -n "$VERSION" ] && [ "$app_version" = "$VERSION" ] || { echo "::error::.app の版 ($app_version) が $VERSION と違う"; exit 1; }

      # 一時キーチェーンに証明書を読み込み、検索リストに加える (build-macos.sh は codesign / security find-identity でこれを使う)。
      # 出典: https://docs.github.com/en/actions/use-cases-and-examples/deploying/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # 書き出す .p12・.p8 を自分だけが読めるようにする
          umask 077
          keychain="$RUNNER_TEMP/mukuchi-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # -P / -p のパスワードはコマンドライン引数なので、実行中は同じマシンの他ユーザーからも ps で見える。
          # GitHub-hosted runner は job ごとに使い捨ての VM なので許容する。self-hosted runner に移す場合は
          # 共有マシンで動かさない (security import は -P を省くと GUI で尋ねるため CI では代わりがない)
          security import "$p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
          # 公証用 API キー (.p8)。後の cleanup で消す
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # devShell を使わない (Apple のツールと macOS 標準のコマンドだけで動く)
      - name: Sign, notarize and staple
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" apps/desktop/scripts/build-macos.sh --sign-only

      # 検証 (ビルドした本体を実行する) の前に資格情報を片付ける
      - name: Clean up signing materials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mukuchi-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

      - name: Verify
        run: apps/desktop/scripts/verify-macos.sh

      # 添付は版番号なしの mukuchi_aarch64.dmg (と .sha256) と updater 用の mukuchi_aarch64.app.tar.gz。LP は固定 URL
      # https://github.com/minimalcorp/mukuchi/releases/latest/download/mukuchi_aarch64.dmg を使い (latest/download は
      # 公開済みでプレリリースでない「Latest」の Release の添付を返す)、版は Release のタイトル・タグで分かるため。
      # 出典: https://docs.github.com/en/repositories/releasing-projects-on-github/linking-to-releases
      - name: Prepare release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          src="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/mukuchi_${VERSION}_aarch64.dmg"
          [ -f "$src" ] || { echo "::error::$src がない"; exit 1; }
          out="$RUNNER_TEMP/release"
          rm -rf "$out"; mkdir -p "$out"
          /bin/cp -p "$src" "$out/mukuchi_aarch64.dmg"
          # .sha256 は添付のファイル名で書く (ダウンロードした名前のまま shasum -c で確かめられるように)
          (cd "$out" && shasum -a 256 mukuchi_aarch64.dmg > mukuchi_aarch64.dmg.sha256)
          # updater 用 (build-macos.sh --sign-only が staple 後の .app から作り、Verify で中身・署名を確かめ済み)。
          # .sha256 は publish-desktop での確認用で、Release には添付しない (署名は latest.json が持つ)
          /bin/cp -p apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/updater/mukuchi_aarch64.app.tar.gz "$out/"
          (cd "$out" && shasum -a 256 mukuchi_aarch64.app.tar.gz > mukuchi_aarch64.app.tar.gz.sha256)
          # 最上位が mukuchi.app/ であること (updater は先頭のパス要素を捨てて展開する) を記録に残す
          /usr/bin/tar -tzf "$out/mukuchi_aarch64.app.tar.gz" | head -n 5
          python3 apps/desktop/scripts/check-updater-archive.py "$out/mukuchi_aarch64.app.tar.gz"
      # publish が失敗した時に手で Release を作り直せるよう数日残す
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mukuchi-dmg-signed
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  # 順序: 版上げコミットを作り直して build と同じ ID か確かめる → main が開始時のままでタグがないことを確かめる →
  # 下書きの Release を作って .dmg を添付 (アップロードの失敗はここで起き、main・タグは変わらない) →
  # main とタグを atomic に push (失敗したら下書きを消す。公開されない) → 下書きを公開して Latest にする。
  # 下書きはタグを作らないため、push の前に作ってよい。公開の時点ではタグが既にあるのでそれに結び付く
  publish-desktop:
    name: Publish desktop (push tag, GitHub Release)
    needs: [prepare, sign]
    runs-on: ubuntu-24.04
    environment: production-desktop
    permissions:
      contents: write # Release の作成・公開 (main・タグの push は Deploy Key で行う)
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # main の ruleset を bypass できる Deploy Key で checkout する (actions/checkout が ssh-agent に鍵を入れ、
      # origin を SSH にする)。この job では第三者のパッケージを入れない・ビルドした本体を実行しない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mukuchi-dmg-signed
          path: ${{ runner.temp }}/release
      - name: Check assets
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          ls -l
          sha256sum -c mukuchi_aarch64.dmg.sha256 mukuchi_aarch64.app.tar.gz.sha256
      - name: Bump version (same commit as build)
        env:
          BUMP: ${{ inputs.bump }}
          EPOCH: ${{ needs.prepare.outputs.epoch }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: scripts/release-commit.sh desktop "$BUMP" "$EPOCH" "$COMMIT"
      - name: Check main and tag
        run: scripts/release-push.sh --check-only "$TAG" "$GITHUB_SHA"
      # updater の署名と latest.json (docs/architecture.md「アップデート」)。署名鍵はこの step にだけ渡す。
      # scripts/sign-updater.mjs は Node の標準ライブラリだけで minisign 形式の署名を作り、tauri.conf.json の
      # plugins.updater.pubkey (このコミットの .app に入っている公開鍵) で検証してから書く。
      # trusted comment に版を入れる (requireSignedVersion)。url は版付き (Latest が変わっても版と中身がずれない)
      - name: Sign updater archive (latest.json)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/updater"
          mkdir -p "$out"
          node scripts/sign-updater.mjs --file "$RUNNER_TEMP/release/mukuchi_aarch64.app.tar.gz" --version "$VERSION" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/mukuchi_aarch64.app.tar.gz" \
            --pubkey-config apps/desktop/src-tauri/tauri.conf.json --out "$out"
          cat "$out/latest.json"
      # 下書きは contents: write のトークンでないと見えないため、ここで下書きを含めて確かめる
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .tag_name")" ]; then
            echo "::error::$TAG の Release (下書きを含む) が既にある。不要な下書きなら消してから実行し直す"; exit 1
          fi
          # ここから先で失敗したら (添付のアップロードの途中を含む) 後の step で下書きを消す
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          # リリースノートの起点は前の desktop のタグ (web-v* のタグを起点にしないため明示する)
          start=()
          if [ -n "$(git ls-remote --tags origin "refs/tags/desktop-v$PREVIOUS")" ]; then
            start=(--notes-start-tag "desktop-v$PREVIOUS")
          fi
          out="$RUNNER_TEMP/release"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "mukuchi $VERSION" --notes "macOS (Apple Silicon) / Developer ID 署名・公証済み" \
            --generate-notes "${start[@]}" \
            "$out/mukuchi_aarch64.dmg" "$out/mukuchi_aarch64.dmg.sha256" \
            "$out/mukuchi_aarch64.app.tar.gz" "$RUNNER_TEMP/updater/latest.json"
      - name: Push version bump and tag
        id: push
        run: scripts/release-push.sh "$TAG" "$GITHUB_SHA"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --draft=false --latest
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [ "$latest" = "$TAG" ] || { echo "::error::Latest の Release が $latest ($TAG でない)"; exit 1; }
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      # アプリの endpoint (releases/latest/download/latest.json) がこの版の latest.json を返すこと。
      # 公開済みなので、ここで失敗しても取り消さない。job は失敗にせず警告に留める
      # (失敗にすると deploy-web-for-desktop が skip され、LP の版の表示だけ古いまま残るため。docs/release.md の「失敗した時」)
      - name: Check updater endpoint
        continue-on-error: true
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          for _ in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 -o "$RUNNER_TEMP/latest-check.json" "$url" \
              && cmp -s "$RUNNER_TEMP/latest-check.json" "$RUNNER_TEMP/updater/latest.json"; then
              echo "updater: $url → $VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::$url がこの版の latest.json を返さない (アプリは前の版のままになる)"
          cat "$RUNNER_TEMP/latest-check.json" 2>/dev/null || true
          exit 1
      # push できなかった時は公開しない。下書きを消して、同じ版で実行し直せるようにする
      # (push 済みで公開だけ失敗した時は下書きを残す。docs/release.md の「失敗した時」)
      - name: Delete draft release (push failed)
        if: failure() && steps.draft.outputs.attempted == 'true' && steps.push.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 下書きの時だけ消す (タグは push していないので残らない)
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi

  # LP は desktop の版をビルド時に tauri.conf.json から読む (apps/web/app/lib/site.ts)。desktop の公開後に LP を配信し直し、
  # 表示する版を公開した desktop に合わせる。配信するのは main ではなく最後の web のタグのソース (main にある未リリースの
  # web の変更を出さないため) に、公開した desktop のタグの tauri.conf.json だけを重ねたもの。web の版・タグは変えない。
  # 失敗しても desktop の公開は済んでいる。この job を Re-run する (docs/release.md)
  deploy-web-for-desktop:
    name: Deploy web (desktop version)
    needs: [prepare, publish-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-web
      url: https://mukuchi.minimalcorp.com
    permissions:
      id-token: write # AWS の OIDC 用
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DESKTOP_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # 古い run を Re-run した時に、後から公開した desktop の版の表示を古い版で上書きしないよう、最新の desktop のタグか確かめる
      - name: Find latest tags
        id: web
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY.git"
          latest_desktop="$(git ls-remote --tags --refs "$url" 'refs/tags/desktop-v*' | sed 's|.*refs/tags/||' | sort -V | tail -n 1)"
          [ "$latest_desktop" = "$DESKTOP_TAG" ] || { echo "::error::最新の desktop のタグは $latest_desktop ($DESKTOP_TAG でない)。配信しない"; exit 1; }
          tag="$(git ls-remote --tags --refs "$url" 'refs/tags/web-v*' \
            | sed 's|.*refs/tags/||' | sort -V | tail -n 1)"
          [ -n "$tag" ] || { echo "::error::web のタグ (web-v*) がない"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.web.outputs.tag }}
          persist-credentials: false
      - name: Overlay desktop version
        run: |
          set -euo pipefail
          conf=apps/desktop/src-tauri/tauri.conf.json
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$DESKTOP_TAG"
          git checkout FETCH_HEAD -- "$conf"
          v="$(node -p "require('./$conf').version")"
          [ "$v" = "$VERSION" ] || { echo "::error::$DESKTOP_TAG の tauri.conf.json の版 ($v) が $VERSION と違う"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      # 版を tauri.conf.json から読まない古い web のタグだと、配信しても版が変わらない。配信の前にビルドして確かめる
      # (sst deploy は同じビルドをもう一度行う)
      - name: Check built version
        env:
          WEB_TAG: ${{ steps.web.outputs.tag }}
        run: |
          set -euo pipefail
          pnpm --filter @mukuchi/web build
          grep -qF "v$VERSION" apps/web/build/client/index.html \
            || { echo "::error::$WEB_TAG のビルドに v$VERSION がない (版を tauri.conf.json から読まない web の版)。web をリリースし直す"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: sst deploy
        env:
          MUKUCHI_WEB_CERT_ARN: ${{ vars.MUKUCHI_WEB_CERT_ARN }}
          WEB_TAG: ${{ steps.web.outputs.tag }}
        run: |
          set -euo pipefail
          pnpm exec sst deploy --stage production
          echo "web \`$WEB_TAG\` を desktop $VERSION の版で配信し直した" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- web

  deploy-web:
    name: Deploy web (sst deploy)
    needs: prepare
    if: inputs.target == 'web'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-web
      url: https://mukuchi.minimalcorp.com
    permissions:
      id-token: write # AWS の OIDC 用
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # タグを付けるソースそのものをデプロイする
      - name: Bump version (same commit as prepare)
        env:
          BUMP: ${{ inputs.bump }}
          EPOCH: ${{ needs.prepare.outputs.epoch }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: scripts/release-commit.sh web "$BUMP" "$EPOCH" "$COMMIT"
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # デプロイした後に版上げを push できない状態 (main が進んだ) を、デプロイの前にできるだけ避ける。
      # ここから publish-web の push までに main が進むと、デプロイは済んだが版上げは push されない (docs/release.md)
      - name: Check main has not moved
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "::error::実行中に main が進んだ ($GITHUB_SHA → $remote_main)。デプロイしない。Actions > Release を main で実行し直す"
            exit 1
          fi
      # build (pnpm --filter @mukuchi/web build) は sst deploy の中で StaticSite が実行する
      - name: sst deploy
        env:
          MUKUCHI_WEB_CERT_ARN: ${{ vars.MUKUCHI_WEB_CERT_ARN }}
        run: pnpm exec sst deploy --stage production

  publish-web:
    name: Publish web (push tag)
    needs: [prepare, deploy-web]
    runs-on: ubuntu-24.04
    environment: production-web
    permissions:
      contents: read # main・タグの push は Deploy Key で行う
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Bump version (same commit as deploy)
        env:
          BUMP: ${{ inputs.bump }}
          EPOCH: ${{ needs.prepare.outputs.epoch }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: scripts/release-commit.sh web "$BUMP" "$EPOCH" "$COMMIT"
      - name: Push version bump and tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/release-push.sh "$TAG" "$GITHUB_SHA"
          echo "デプロイ済み・\`$TAG\` を push した" >> "$GITHUB_STEP_SUMMARY"
